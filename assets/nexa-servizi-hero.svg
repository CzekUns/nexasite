  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0a2747" flood-opacity=".11"/></filter>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<circle cx="950" cy="120" r="185" fill="#d50019" opacity=".045"/>
