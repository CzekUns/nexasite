<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc">
<title id="title">Nexa Servizi — risultati concreti</title>
<desc id="desc">Dashboard illustrata con gestione documenti, produttività, coordinamento team, monitoraggio risultati e processo dalla pianificazione ai risultati.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b2748" flood-opacity=".18"/></filter>
  <linearGradient id="badge" x1="0" x2="1"><stop stop-color="#6f8ba6"/><stop offset=".28" stop-color="#375b7f"/><stop offset="1" stop-color="#082b50"/></linearGradient>
</defs>
<path d="M35 700 C220 675 275 570 430 545 S735 500 1045 565" fill="none" stroke="#e31b34" stroke-width="4" opacity=".82"/>

<g filter="url(#shadow)">
  <rect x="210" y="65" width="320" height="175" rx="28" fill="#fff"/>
  <rect x="565" y="45" width="315" height="195" rx="28" fill="#fff"/>
  <rect x="245" y="285" width="305" height="150" rx="28" fill="#fff"/>
  <rect x="245" y="465" width="305" height="150" rx="28" fill="#fff"/>
  <rect x="585" y="275" width="375" height="340" rx="30" fill="#fff"/>
  <rect x="220" y="650" width="565" height="125" rx="32" fill="url(#badge)"/>
</g>

<!-- Gestione documenti -->
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="245" y="100" width="68" height="68" rx="18" fill="#f1f5f9"/>
  <path d="M266 116h25l10 10v28h-35z" fill="none" stroke="#173a62" stroke-width="4" stroke-linejoin="round"/>
  <path d="M291 116v12h10" fill="none" stroke="#173a62" stroke-width="4"/>
  <path d="M274 136h16M274 146h12" stroke="#173a62" stroke-width="3" stroke-linecap="round"/>
  <circle cx="314" cy="150" r="19" fill="#e31b34"/>
  <path d="M305 150l7 7 13-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="245" y="200" font-size="24" font-weight="700" fill="#0b2f57">GESTIONE DOCUMENTI</text>
  <rect x="245" y="214" width="220" height="10" rx="5" fill="#d9e2eb"/>
  <rect x="245" y="231" width="150" height="10" rx="5" fill="#d9e2eb"/>

  <!-- Produttività -->
  <rect x="600" y="80" width="70" height="70" rx="18" fill="#fff1f3"/>
  <rect x="618" y="122" width="10" height="24" rx="4" fill="#b7c5d2"/>
  <rect x="635" y="106" width="10" height="40" rx="4" fill="#7392ad"/>
  <rect x="652" y="92" width="10" height="54" rx="4" fill="#e31b34"/>
  <text x="600" y="180" font-size="22" font-weight="700" fill="#0b2f57">PRODUTTIVITÀ</text>
  <text x="600" y="225" font-size="54" font-weight="800" fill="#0b2f57">+32%</text>
  <text x="755" y="224" font-size="17" fill="#667a90">efficienza media</text>

  <!-- Coordinamento -->
  <rect x="280" y="317" width="64" height="64" rx="18" fill="#f1f5f9"/>
  <circle cx="301" cy="338" r="9" fill="#173a62"/><circle cx="323" cy="335" r="10" fill="#e31b34"/><circle cx="342" cy="339" r="8" fill="#173a62"/>
  <path d="M288 364c2-13 8-18 16-18s14 6 16 18" fill="#173a62"/><path d="M307 367c2-15 8-22 17-22s15 7 17 22" fill="#e31b34"/>
  <text x="370" y="342" font-size="21" font-weight="700" fill="#0b2f57">COORDINAMENTO</text>
  <text x="370" y="369" font-size="21" font-weight="700" fill="#0b2f57">TEAM</text>
  <rect x="370" y="389" width="140" height="9" rx="5" fill="#d9e2eb"/>
  <rect x="370" y="406" width="95" height="9" rx="5" fill="#d9e2eb"/>

  <!-- Monitoraggio -->
  <rect x="280" y="498" width="64" height="64" rx="18" fill="#f1f5f9"/>
  <rect x="295" y="532" width="8" height="18" rx="3" fill="#9eb0c2"/><rect x="309" y="521" width="8" height="29" rx="3" fill="#5c7d9c"/><rect x="323" y="509" width="8" height="41" rx="3" fill="#173a62"/>
  <path d="M292 522l17-13 11 4 16-18" fill="none" stroke="#e31b34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M326 495h10v10" fill="none" stroke="#e31b34" stroke-width="4"/>
  <text x="370" y="523" font-size="21" font-weight="700" fill="#0b2f57">MONITORAGGIO</text>
  <text x="370" y="550" font-size="21" font-weight="700" fill="#0b2f57">RISULTATI</text>
  <rect x="370" y="570" width="145" height="9" rx="5" fill="#d9e2eb"/>
  <rect x="370" y="587" width="100" height="9" rx="5" fill="#d9e2eb"/>

  <!-- Processo -->
  <text x="630" y="330" font-size="34" font-weight="800" fill="#0b2f57">Dalla pianificazione</text>
  <text x="630" y="370" font-size="34" font-weight="800" fill="#0b2f57">ai risultati</text>
  <line x1="655" y1="445" x2="885" y2="445" stroke="#91a6b9" stroke-width="5"/>
  <circle cx="655" cy="445" r="13" fill="#0b2f57"/><circle cx="732" cy="445" r="13" fill="#0b2f57"/><circle cx="809" cy="445" r="13" fill="#0b2f57"/><circle cx="886" cy="445" r="15" fill="#e31b34"/>
  <text x="633" y="492" font-size="16" fill="#5f7389">Analisi</text>
  <text x="703" y="492" font-size="16" fill="#5f7389">Soluzione</text>
  <text x="786" y="492" font-size="16" fill="#5f7389">Azione</text>
  <text x="856" y="492" font-size="16" font-weight="700" fill="#e31b34">Risultati</text>
  <rect x="630" y="530" width="270" height="10" rx="5" fill="#d9e2eb"/>
  <rect x="630" y="550" width="205" height="10" rx="5" fill="#d9e2eb"/>

  <!-- Badge -->
  <circle cx="275" cy="695" r="10" fill="#fff"/><circle cx="300" cy="695" r="10" fill="#fff"/><circle cx="325" cy="695" r="10" fill="#fff"/>
  <path d="M260 736c2-20 9-28 18-28s16 8 18 28M285 736c2-22 9-31 18-31s16 9 18 31" fill="#fff"/>
  <line x1="355" y1="681" x2="355" y2="747" stroke="#fff" stroke-opacity=".55"/>
  <text x="385" y="706" font-size="18" fill="#dbe5ee">PERSONE · SOLUZIONI</text>
  <text x="385" y="741" font-size="30" font-weight="800" fill="#fff">RISULTATI CONCRETI</text>
  <rect x="385" y="755" width="95" height="5" rx="3" fill="#e31b34"/>
</g>
</svg>